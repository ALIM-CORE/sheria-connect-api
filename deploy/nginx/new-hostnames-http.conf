# Temporarily enable alongside the EXISTING site to obtain the new TLS certificate.
server {
    listen 80;
    server_name app.sheriaconnect.co.tz admin.sheriaconnect.co.tz;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 503;
    }
}
