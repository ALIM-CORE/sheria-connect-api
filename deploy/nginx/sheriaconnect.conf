# Install only after the existing certificate and sheria-connect-apps certificate exist.
server {
    listen 80;
    server_name sheriaconnect.co.tz www.sheriaconnect.co.tz api.sheriaconnect.co.tz app.sheriaconnect.co.tz admin.sheriaconnect.co.tz;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name sheriaconnect.co.tz www.sheriaconnect.co.tz;
    ssl_certificate /etc/letsencrypt/live/sheriaconnect.co.tz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sheriaconnect.co.tz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    # Preserve verification/reset/invitation URLs sent before the domain split.
    location ^~ /auth/ {
        return 302 https://admin.sheriaconnect.co.tz$request_uri;
    }
    location / {
        proxy_pass http://127.0.0.1:4201;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name api.sheriaconnect.co.tz;
    ssl_certificate /etc/letsencrypt/live/sheriaconnect.co.tz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sheriaconnect.co.tz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 12m;
    location / {
        proxy_pass http://127.0.0.1:6001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;
    server_name app.sheriaconnect.co.tz;
    ssl_certificate /etc/letsencrypt/live/sheria-connect-apps/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sheria-connect-apps/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name admin.sheriaconnect.co.tz;
    ssl_certificate /etc/letsencrypt/live/sheria-connect-apps/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sheria-connect-apps/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location / {
        proxy_pass http://127.0.0.1:4101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
