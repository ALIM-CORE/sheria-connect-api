# CI must never resolve the developer's database or bootstrap accounts from .env.
spring.datasource.url=${TEST_DATABASE_URL:jdbc:postgresql://localhost:5432/sheria_connect_ci}
spring.datasource.username=${TEST_DATABASE_USERNAME:sheria_ci}
spring.datasource.password=${TEST_DATABASE_PASSWORD:ci-only-not-a-production-password}
spring.flyway.baseline-on-migrate=false
app.bootstrap.super-admin.email=
app.bootstrap.super-admin.password=
app.bootstrap.system-admin.email=
app.bootstrap.system-admin.password=
app.auth.mfa.encryption-key=ci-only-mfa-key-not-for-production
app.incident-report.tracking-token-derivation-key=ci-only-tracking-key-not-for-production
app.evidence.storage-root=target/ci-evidence
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.jpa.show-sql=false
logging.level.org.springframework.security=WARN
