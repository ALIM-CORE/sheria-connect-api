name: Sheria Connect API CI and production

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy this tested main revision (production must be enabled)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sheria_connect_ci
          POSTGRES_USER: sheria_ci
          POSTGRES_PASSWORD: ci-only-not-a-production-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sheria_ci -d sheria_connect_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      SPRING_PROFILES_ACTIVE: ci
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/sheria_connect_ci
      TEST_DATABASE_USERNAME: sheria_ci
      TEST_DATABASE_PASSWORD: ci-only-not-a-production-password
      JWT_SECRET: ci-only-signing-secret-at-least-sixty-four-characters-long-not-production
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress verify
      - name: Deployment helper regression tests
        run: python3 -m unittest discover -s deploy/tests -v

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Publish tested revision
        id: image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/alim-core/sheria-connect-backend
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          TAG="$IMAGE:$GITHUB_SHA"
          # A rerun reuses the published revision; it never overwrites it.
          if docker manifest inspect "$TAG" >/dev/null 2>&1; then
            docker pull "$TAG"
          else
            docker build --pull --build-arg BUILD_SHA="$GITHUB_SHA" -t "$TAG" .
            docker push "$TAG"
          fi
          REF=$(docker inspect --format '{{index .RepoDigests 0}}' "$TAG")
          test -n "$REF"
          echo "image=$REF" >> "$GITHUB_OUTPUT"
          echo "Published $REF" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'push' || inputs.deploy)
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    concurrency:
      group: production-backend
      cancel-in-progress: false
    steps:
      - name: Deploy pinned image through VPS deployment helper
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ vars.SERVER_KNOWN_HOSTS }}
          HOST: ${{ vars.SERVER_HOST }}
          USER: ${{ vars.SERVER_USER }}
          SERVER_PATH: ${{ vars.SERVER_PATH }}
          IMAGE_REF: ${{ needs.publish.outputs.image }}
        run: |
          set -euo pipefail
          [[ "$HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$SERVER_PATH" =~ ^/[a-zA-Z0-9/_-]+$ ]]
          [[ "$IMAGE_REF" =~ ^ghcr.io/alim-core/sheria-connect-backend@sha256:[a-f0-9]{64}$ ]]
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$USER@$HOST" \
            "bash '$SERVER_PATH/ops/deploy.sh' 'backend' '$IMAGE_REF' '$GITHUB_SHA'"
