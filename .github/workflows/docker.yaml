name: Build, Push and Deploy Sheria-Connect Backend

on:
  push:
    branches:
      - staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REPOSITORY: ghcr.io/alim-core/sheria-connect-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image URI
        run: echo "IMAGE_URI=${IMAGE_REPOSITORY}:${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Login to GHCR
        run: echo "${{ secrets.NEW_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: docker build -t "$IMAGE_URI" .

      - name: Push Docker image
        run: docker push "$IMAGE_URI"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: IMAGE_URI
          script: |
            set -eu
            echo "${{ secrets.NEW_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd ${{ secrets.SERVER_PATH }}
            sed -i "/^[[:space:]]*backend:/,/^[[:space:]]*[A-Za-z0-9_-]\+:/ s|^\([[:space:]]*image:[[:space:]]*\).*|\1${IMAGE_URI}|" docker-compose.yaml

            if ! sed -n "/^[[:space:]]*backend:/,/^[[:space:]]*[A-Za-z0-9_-]\+:/p" docker-compose.yaml | grep -Fq "$IMAGE_URI"; then
              echo "Backend image was not updated in docker-compose.yaml"
              sed -n "/^[[:space:]]*backend:/,/^[[:space:]]*[A-Za-z0-9_-]\+:/p" docker-compose.yaml
              exit 1
            fi

            docker compose pull backend
            docker compose up -d backend

            echo "Waiting for backend health on the VPS..."
            for attempt in $(seq 1 36); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://127.0.0.1:6001/health || true)
              echo "  Attempt ${attempt}/36: HTTP ${STATUS}"
              if [ "$STATUS" = "200" ]; then
                echo "Backend is healthy on localhost"
                exit 0
              fi

              if ! docker ps --format '{{.Names}}' | grep -qx 'sheria-connect-backend'; then
                echo "Backend container is not running"
                docker compose ps backend
                docker compose logs --tail=120 backend
                exit 1
              fi

              sleep 5
            done

            echo "Backend did not become healthy in time"
            docker compose ps
            docker compose logs --tail=160 backend
            exit 1

      - name: Public health checks
        run: |
          check_url() {
            local URL="$1"
            for attempt in {1..12}; do
              echo "Checking $URL, attempt $attempt/12 ..."
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" || true)
              echo "  HTTP $STATUS"
              if [ "$STATUS" = "200" ]; then
                echo "  OK"
                return 0
              fi
              sleep 5
            done
            echo "  $URL is not healthy"
            return 1
          }

          check_url "https://api.sheriaconnect.co.tz/health"
          check_url "https://sheriaconnect.co.tz/health"
